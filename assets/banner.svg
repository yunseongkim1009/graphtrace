<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GraphTrace — trace any image into Desmos" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c0e16"/><stop offset="1" stop-color="#070810"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(1040 40) rotate(130) scale(560)">
      <stop stop-color="#7c6cff" stop-opacity="0.28"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(140 460) rotate(-50) scale(560)">
      <stop stop-color="#34e0c8" stop-opacity="0.20"/><stop offset="1" stop-color="#34e0c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7c6cff"/><stop offset="0.55" stop-color="#34e0c8"/><stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="curve" x1="360" y1="120" x2="820" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34e0c8"/><stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow1)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="23.5" stroke="#1e2130"/>

  <!-- graph paper -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <line x1="820" y1="40" x2="820" y2="400"/><line x1="900" y1="40" x2="900" y2="400"/><line x1="980" y1="40" x2="980" y2="400"/><line x1="1060" y1="40" x2="1060" y2="400"/><line x1="1140" y1="40" x2="1140" y2="400"/>
    <line x1="760" y1="80" x2="1220" y2="80"/><line x1="760" y1="160" x2="1220" y2="160"/><line x1="760" y1="240" x2="1220" y2="240"/><line x1="760" y1="320" x2="1220" y2="320"/>
  </g>
  <!-- axes -->
  <line x1="760" y1="240" x2="1220" y2="240" stroke="#2a2f42" stroke-width="1.5"/>
  <line x1="980" y1="50" x2="980" y2="400" stroke="#2a2f42" stroke-width="1.5"/>

  <!-- traced photo silhouette (faint) -->
  <path d="M840 300 Q980 60 1120 300" stroke="#ffffff" stroke-opacity="0.10" stroke-width="20" fill="none" stroke-linecap="round"/>
  <!-- fitted parabola glow + line -->
  <path d="M840 300 Q980 60 1120 300" stroke="url(#curve)" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#soft)" opacity="0.7"/>
  <path d="M840 300 Q980 60 1120 300" stroke="url(#curve)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- clicked points -->
  <g>
    <circle cx="840" cy="300" r="7" fill="#0c0e16" stroke="#34e0c8" stroke-width="3"/>
    <circle cx="980" cy="180" r="7" fill="#0c0e16" stroke="#7c6cff" stroke-width="3"/>
    <circle cx="1120" cy="300" r="7" fill="#0c0e16" stroke="#ff7a59" stroke-width="3"/>
  </g>
  <!-- equation chip -->
  <g transform="translate(792,352)">
    <rect width="220" height="34" rx="9" fill="#12141f" stroke="#2a2f42"/>
    <text x="16" y="22" fill="#8b93a5" font-size="13" font-family="'JetBrains Mono', monospace">y = a(x−h)² + k</text>
  </g>

  <!-- logo mark -->
  <g transform="translate(80,120)">
    <rect width="60" height="60" rx="17" fill="url(#logo)"/>
    <rect x="5" y="5" width="50" height="50" rx="13" fill="#0a0c12"/>
    <path d="M17 43 Q30 12 43 30" stroke="#34e0c8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="17" cy="43" r="3.4" fill="#7c6cff"/><circle cx="43" cy="30" r="3.4" fill="#ff7a59"/>
  </g>

  <!-- wordmark -->
  <text x="80" y="236" font-size="74" font-weight="800" letter-spacing="1" fill="#f4f5f8">Graph<tspan fill="#7c6cff">Trace</tspan></text>
  <text x="84" y="282" font-size="20" font-weight="600" letter-spacing="5" fill="#8b93a5">TRACE&#160;ANY&#160;IMAGE&#160;INTO&#160;DESMOS</text>

  <!-- feature pills -->
  <g font-size="15" font-weight="600">
    <g transform="translate(80,326)">
      <rect width="150" height="38" rx="19" fill="#7c6cff" fill-opacity="0.14" stroke="#7c6cff" stroke-opacity="0.45"/>
      <text x="75" y="24.5" text-anchor="middle" fill="#b3a9ff">✨ auto-trace</text>
    </g>
    <g transform="translate(242,326)">
      <rect width="158" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#2a2f42"/>
      <text x="79" y="24.5" text-anchor="middle" fill="#aeb4c2">10 curve forms</text>
    </g>
    <g transform="translate(412,326)">
      <rect width="196" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#2a2f42"/>
      <text x="98" y="24.5" text-anchor="middle" fill="#aeb4c2">paste-ready Desmos</text>
    </g>
  </g>
</svg>
